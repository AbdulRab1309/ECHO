name: ECHO CI/CD

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  tests:
    runs-on: ubuntu-latest
    needs: build

    steps: 
      - name: checkout repository 
        uses: actions/checkout@v4

      - name: Setup Node.js 
        uses: actions/setup-node@v4
        with: 
            node-version: 22

      - name: Install Frontend Dependencies
        run: npm ci 

      - name: Run lint 
        run: npm run lint
  